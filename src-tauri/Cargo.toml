[package]
name = "porteiro"
version = "0.1.0"
description = "Gate that blocks distracting sites system-wide until a password is typed"
authors = ["juninmd"]
edition = "2021"
license = "MIT"

[lib]
name = "porteiro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
argon2 = "0.6.0"
image = "0.25.10"
nokhwa = { version = "0.10.11", features = ["input-native"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.153"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tauri = { version = "2.12.3", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.3"
uuid = { version = "1.28.0", features = ["v4"] }
xcap = "0.9.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_RemoteDesktop", "Win32_System_Threading"] }
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.27.0"

# Argon2 is deliberately slow; unoptimized it makes every test and every dev-mode login take seconds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
